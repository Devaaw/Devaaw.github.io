<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devaaw Apps</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #faf6f0;
        color: #2b2b2b;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      main {
        padding: 40px 24px;
        width: 100%;
        max-width: 560px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #6b6b6b;
        line-height: 1.6;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
      }
      li {
        background: #fff;
        border: 1px solid #e7ded0;
        border-radius: 14px;
        margin-bottom: 12px;
      }
      a {
        color: #4a7c59;
      }
      li a {
        display: block;
        padding: 18px 20px;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 4px;
        color: #6b6b6b;
        font-weight: 400;
      }
      footer {
        margin-top: 24px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Devaaw Apps</h1>
      <p>Official app pages, policies and developer information.</p>
      <ul>
        <li>
          <a href="./escape-arrows/">
            Escape Arrows
            <small>Privacy policy and data deletion</small>
          </a>
        </li>
        <li>
          <a href="./tanpdf/">
            Tan PDF
            <small>Official Tan PDF website</small>
          </a>
        </li>
      </ul>
      <footer>
        <a href="./app-ads.txt">app-ads.txt</a>
      </footer>
    </main>
  </body>
</html>
